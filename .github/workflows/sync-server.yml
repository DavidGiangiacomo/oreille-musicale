name: Serveur de synchronisation

# Déploie le serveur de synchronisation sur Cloudflare (server/README.md).
# Prérequis, dans Settings → Secrets and variables → Actions : les secrets
# CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID. Sans eux, le workflow s'arrête sans
# rien déployer. La base D1 « oreille-musicale-sync » est retrouvée, ou créée, seule.
on:
  push:
    # TEMPORAIRE : branche de travail ajoutée pour vérifier la configuration
    # Cloudflare avant la PR ; à retirer avant la fusion.
    branches: [main, ccr-3cdc9837-hsf7nd]
    paths:
      - 'server/**'
      - 'src/sync/protocol.ts'
      - '.github/workflows/sync-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Vérifier la configuration
        id: config
        working-directory: .
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::notice::Configuration Cloudflare incomplète, rien n'est déployé. Manquant :$missing (voir server/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - if: steps.config.outputs.ready == 'true'
        run: npm ci
      - name: Retrouver ou créer la base D1
        if: steps.config.outputs.ready == 'true'
        run: |
          find_database() {
            npx wrangler d1 list --json | node -e '
              let text = "";
              process.stdin.on("data", (chunk) => (text += chunk));
              process.stdin.on("end", () => {
                const found = JSON.parse(text).find((db) => db.name === "oreille-musicale-sync");
                process.stdout.write(found ? found.uuid : "");
              });'
          }
          id="$(find_database)"
          if [ -z "$id" ]; then
            echo "Création de la base D1 oreille-musicale-sync."
            npx wrangler d1 create oreille-musicale-sync > /dev/null
            id="$(find_database)"
          fi
          if [ -z "$id" ]; then
            echo "::error::Base D1 introuvable et impossible à créer : vérifier que le jeton d'API a la permission « D1 → Edit »."
            exit 1
          fi
          # L'identifiant n'est pas un secret, mais il n'a rien à faire dans les journaux.
          echo "::add-mask::$id"
          sed -i "s/00000000-0000-0000-0000-000000000000/$id/" wrangler.jsonc
      - name: Mettre à jour le schéma de la base
        if: steps.config.outputs.ready == 'true'
        run: npm run migrate
      - name: Déployer le Worker
        id: deploy
        if: steps.config.outputs.ready == 'true'
        run: |
          npm run deploy | tee deploy.log
          url="$(grep -Eo 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Vérifier le serveur en ligne
        if: steps.config.outputs.ready == 'true' && steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Un dossier jetable : un bloc envoyé, relu, puis le dossier effacé.
          bucket="$(openssl rand -hex 16)"
          token="$(openssl rand -base64 32 | tr '+/' '-_' | tr -d '=')"
          auth="Authorization: Bearer $token"
          curl -fsS "$URL/v1/health"
          curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' \
            -d '{"records":[{"id":"verification-en-ligne0","data":"essai"}]}' \
            "$URL/v1/buckets/$bucket/records"
          curl -fsS -H "$auth" "$URL/v1/buckets/$bucket/records?after=0&limit=10" | grep -q '"seq":1'
          curl -fsS -X DELETE -H "$auth" "$URL/v1/buckets/$bucket"
          echo "Serveur en ligne : $URL"
