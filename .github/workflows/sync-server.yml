name: Serveur de synchronisation

# Déploie le serveur de synchronisation sur Cloudflare (server/README.md).
# Prérequis, dans Settings → Secrets and variables → Actions :
#   - secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID ;
#   - D1_DATABASE_ID (identifiant de la base D1 « oreille-musicale-sync »), en
#     variable ou en secret.
# Sans eux, le workflow s'arrête sans rien déployer.
on:
  push:
    # TEMPORAIRE : branche de travail ajoutée pour vérifier la configuration
    # Cloudflare avant la PR ; à retirer avant la fusion.
    branches: [main, ccr-3cdc9837-hsf7nd]
    paths:
      - 'server/**'
      - 'src/sync/protocol.ts'
      - '.github/workflows/sync-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID || secrets.D1_DATABASE_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Vérifier la configuration
        id: config
        working-directory: .
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ -n "$D1_DATABASE_ID" ] || missing="$missing D1_DATABASE_ID"
          if [ -n "$missing" ]; then
            echo "::notice::Configuration Cloudflare incomplète, rien n'est déployé. Manquant :$missing (voir server/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - if: steps.config.outputs.ready == 'true'
        run: npm ci
      - name: Renseigner la base D1
        if: steps.config.outputs.ready == 'true'
        run: |
          clean() { printf '%s' "$1" | tr -d '[:space:]-' | tr 'A-F' 'a-f'; }
          id="$(clean "$D1_DATABASE_ID")"
          if [ "$id" = "$(clean "$CLOUDFLARE_ACCOUNT_ID")" ]; then
            echo "::error::D1_DATABASE_ID contient l'identifiant du compte Cloudflare. Il faut celui de la base : Storage & databases → D1 → oreille-musicale-sync → « Database ID »."
            exit 1
          fi
          if ! printf '%s' "$id" | grep -Eq '^[0-9a-f]{32}$'; then
            echo "::error::D1_DATABASE_ID n'a pas la forme d'un identifiant de base D1 (xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx ; valeur reçue : ${#id} caractères hors tirets et espaces)."
            exit 1
          fi
          uuid="${id:0:8}-${id:8:4}-${id:12:4}-${id:16:4}-${id:20:12}"
          sed -i "s/00000000-0000-0000-0000-000000000000/$uuid/" wrangler.jsonc
      - name: Mettre à jour le schéma de la base
        if: steps.config.outputs.ready == 'true'
        run: npm run migrate
      - name: Déployer le Worker
        if: steps.config.outputs.ready == 'true'
        run: npm run deploy
