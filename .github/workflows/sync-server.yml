name: Serveur de synchronisation

# Déploie le serveur de synchronisation sur Cloudflare (server/README.md).
# Prérequis, dans Settings → Secrets and variables → Actions :
#   - secrets CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID ;
#   - variable D1_DATABASE_ID (identifiant de la base D1 « oreille-musicale-sync »).
# Sans eux, le workflow s'arrête sans rien déployer.
on:
  push:
    # TEMPORAIRE : branche de travail ajoutée pour vérifier la configuration
    # Cloudflare avant la PR ; à retirer avant la fusion.
    branches: [main, ccr-3cdc9837-hsf7nd]
    paths:
      - 'server/**'
      - 'src/sync/protocol.ts'
      - '.github/workflows/sync-server.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-server
  cancel-in-progress: false

jobs:
  deploy:
    name: Déploiement
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Vérifier la configuration
        id: config
        working-directory: .
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$D1_DATABASE_ID" ]; then
            echo "::notice::Cloudflare n'est pas encore configuré : rien à déployer (voir server/README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.config.outputs.ready == 'true'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - if: steps.config.outputs.ready == 'true'
        run: npm ci
      - name: Renseigner la base D1
        if: steps.config.outputs.ready == 'true'
        run: sed -i "s/00000000-0000-0000-0000-000000000000/${D1_DATABASE_ID}/" wrangler.jsonc
      - name: Mettre à jour le schéma de la base
        if: steps.config.outputs.ready == 'true'
        run: npm run migrate
      - name: Déployer le Worker
        if: steps.config.outputs.ready == 'true'
        run: npm run deploy
